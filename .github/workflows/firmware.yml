name: Build firmware

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python packages
        run: pip install Pillow fonttools

      - name: JieLi toolchain (clang for pi32v2)
        run: |
          for i in 1 2 3; do sh tools/get_toolchain.sh "$HOME/.jieli" && break; sleep 20; done
          ls "$HOME/.jieli/toolchain/pi32v2/bin/clang"

      - name: JieLi AC79 SDK (three files of it go into the package)
        run: |
          for i in 1 2 3; do
            git clone -q --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK" && break
            rm -rf "$HOME/fw-AC79_AIoT_SDK"; sleep 30
          done
          ls "$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot"

      - name: Version
        id: v
        run: echo "ver=$(cat BURGER_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./build.sh --release "${{ steps.v.outputs.ver }}"

      - name: Host tests (engines)
        run: sh firmware/engines/tests/run.sh || echo "engine tests failed (see log)"

      - uses: actions/upload-artifact@v4
        with:
          name: burger-fm1-${{ steps.v.outputs.ver }}
          path: build/release-${{ steps.v.outputs.ver }}/

      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.ver }}"
          T="fw-v$V"
          D="build/release-$V"
          gh release delete "$T" -y --cleanup-tag 2>/dev/null || true
          gh release create "$T" "$D"/* --prerelease --target "$GITHUB_SHA" \
            --title "Burger Studio FM-1 firmware $V" \
            --notes "Burger Studio firmware for the M-VAVE FM-1, built on Felucca 1.8.2 (GPL-3.0-only). Untested on hardware: back up your FM-1 first. Install: python3 tools/fm1_install.py felucca-$V.fwsc"
